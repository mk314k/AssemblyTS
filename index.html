<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssemblyTS — Interactive RISC-V Assembly IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/7ca2746f93.js" crossorigin="anonymous"></script>
  </head>
  <body class="flex-vertical">
    <header class="flex-vertical">
      <nav class="flex-horizontal nav-bar">
        <div class="brand flex-horizontal">
          <span class="brand-badge"><i class="fa-solid fa-microchip"></i></span>
          <div class="header">AssemblyTS</div>
          <span class="version-pill">RISC-V 32I</span>
        </div>
        <div class="header-meta flex-horizontal">
          <span class="status-indicator" id="statusBadge"><span class="status-dot"></span> Ready</span>
        </div>
      </nav>
    </header>
    <main class="flex-horizontal">
        <div class="flex-vertical tools">
            <input type="text" id="buildAddr" class="tool-input" value="504" required>
            <span class="tool-span flex-vertical"><span>Build</span><span>Address</span></span>
            <input type="text" id="runAddr" class="tool-input" value="504" required>
            <span class="tool-span flex-vertical"><span>Run</span><span>Address</span></span>
            <div class="tool"></div>
            <div class="tool flex-vertical" id="buildRun">
                <i class="fa-solid fa-gears"></i>
                <span class="tool-span flex-vertical"><span>Build</span><span>&Run</span></span>
            </div>
            <div class="tool flex-vertical" id="build">
                <i class="fa-solid fa-gear"></i>
                <span>Build</span>
            </div>
            <div class="tool flex-vertical" id="run">
                <i class="fa-solid fa-terminal"></i>
                <span>Run</span>
            </div>
            <div class="tool flex-vertical" id="git">
                <i class="fa-brands fa-github"></i>
                <span id="gitStatus" class="tool-span">Login</span>
            </div>
        </div>
        <div class="memory flex-vertical">
            <div class="flex-horizontal">
                <div id="imemory" class="memory-option">Instruction</div>
                <div id="dmemory" class="memory-option">Data</div>
            </div>
            <div id="memory"></div>
        </div>
        <div class="flex-vertical">
            <div class="registers flex-horizontal" id="registers"></div>
            <div class="code-container flex-horizontal" id="code-container">
                <div class="flex-vertical line-num" id="lineNum"></div>
                <div name="code" id="code" contenteditable="true"></div>
                <div id="codeTab" class="flex-vertical code-tab"></div>
            </div>
            <div name="console" id="console" readonly></div>
        </div>
        <div class="pop-up flex-vertical" id="dialogBox"></div>
    </main>
    <footer>
        <!-- Footer section -->
        <div class="flex-horizontal" id="footer-elements">
            <div>
                <a href = "https://github.com/mk314k/AssemblyTS/blob/main/docs/documentation.md">Documentation</a>
            </div>
            <div class="flex-horizontal" id ="social-icons"></div>
            <div id="source-code">
                <!-- Source code link -->
                See Source Code on <a href="https://github.com/mk314k/Pyssemble-typescript">Github</a>
            </div>
        </div>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
